  <body>
    <details>
      <summary>調整</summary>
      <form aria-label="見た目の調整">
        <fieldset>
          <legend><button type="button" class="group-toggle" aria-expanded="true">文字</button></legend>
          <div class="control">
            <label for="text-control">文字</label>
            <input id="text-control" data-param="text" type="text" />
          </div>
          <div class="control">
            <label for="font-control">書体</label>
            <input id="font-control" data-param="font" type="text" />
          </div>
          <div class="control">
            <label for="background-control">背景色</label>
            <input id="background-control" data-param="background" type="color" />
          </div>
        </fieldset>

        <fieldset>
          <legend><button type="button" class="group-toggle" aria-expanded="true">線と帯</button></legend>
          <!--
            P57(issue #86): 断面を先頭に置き(パネルの上の方)、続けて断面で決まる見た目(丸い線: 糸の色、帯: 帯の幅・表の色)、
            そのあと断面に依らない線の並び。効かない断面の項目は hidden(src/ui/controls.ts の SECTION_ONLY)。
          -->
          <div class="control">
            <label for="section-control">断面</label>
            <select id="section-control" data-param="section"></select>
          </div>
          <div class="control">
            <label for="thread-color-control">糸の色</label>
            <input id="thread-color-control" data-param="threadColor" type="color" />
          </div>
          <div class="control">
            <label for="band-width-control">帯の幅</label>
            <input id="band-width-control" data-param="bandWidth" type="range" min="1" max="30" step="0.5" />
            <output for="band-width-control"></output>
          </div>
          <div class="control">
            <label for="band-front-control">表の色</label>
            <input id="band-front-control" data-param="bandFront" type="color" />
          </div>
          <div class="control">
            <label for="band-back-control">裏の色</label>
            <input id="band-back-control" data-param="bandBack" type="color" />
          </div>
          <div class="control">
            <label for="pitch-control">糸の間隔</label>
            <input id="pitch-control" data-param="pitch" type="range" min="1" max="30" step="0.5" />
            <output for="pitch-control"></output>
          </div>
          <div class="control">
            <label for="width-control">糸の太さ</label>
            <input id="width-control" data-param="width" type="range" min="0.5" max="12" step="0.1" />
            <output for="width-control"></output>
          </div>
          <div class="control">
            <label for="angle-control">線の角度</label>
            <input id="angle-control" data-param="angle" type="range" min="0" max="180" step="1" />
            <output for="angle-control"></output>
          </div>
        </fieldset>

        <fieldset>
          <legend><button type="button" class="group-toggle" aria-expanded="true">素材</button></legend>
          <!--
            P75(issue #130): 素材の select(選択肢は実装済みの素材だけ。src/ui/controls.ts の MATERIAL_LABELS)と、素材ごとのつまみ。
            つまみは上限を決めない(type="number"、max を置かない)。WebGL で丸い線を描くときだけ効く(帯では隠す)。
          -->
          <div class="control">
            <label for="material-control">素材</label>
            <select id="material-control" data-param="material"></select>
          </div>
          <div class="control">
            <label for="silk-gloss-control">照りの強さ</label>
            <input id="silk-gloss-control" data-param="silkGloss" type="number" step="any" />
          </div>
          <div class="control">
            <label for="silk-sharpness-control">照りの鋭さ</label>
            <input id="silk-sharpness-control" data-param="silkSharpness" type="number" step="any" />
          </div>
          <div class="control">
            <label for="silk-shift-control">照りの位置</label>
            <input id="silk-shift-control" data-param="silkShift" type="number" step="any" />
          </div>
          <div class="control">
            <label for="silk-streak-control">照りの筋の幅</label>
            <input id="silk-streak-control" data-param="silkStreak" type="number" step="any" />
          </div>
          <div class="control">
            <label for="silk-dim-control">地の沈み</label>
            <input id="silk-dim-control" data-param="silkDim" type="number" step="any" />
          </div>
          <div class="control">
            <label for="rubber-gloss-control">ゴムの照りの強さ</label>
            <input id="rubber-gloss-control" data-param="rubberGloss" type="number" step="any" />
          </div>
          <div class="control">
            <label for="rubber-sharpness-control">ゴムの照りの鋭さ</label>
            <input id="rubber-sharpness-control" data-param="rubberSharpness" type="number" step="any" />
          </div>
          <div class="control">
            <label for="rubber-rim-control">縁の照り</label>
            <input id="rubber-rim-control" data-param="rubberRim" type="number" step="any" />
          </div>
          <div class="control">
            <label for="glass-tint-control">ガラスの色の濃さ</label>
            <input id="glass-tint-control" data-param="glassTint" type="number" step="any" />
          </div>
          <div class="control">
            <label for="glass-edge-control">ガラスの縁の細さ</label>
            <input id="glass-edge-control" data-param="glassEdge" type="number" step="any" />
          </div>
          <div class="control">
            <label for="glass-mirror-control">映り込み</label>
            <input id="glass-mirror-control" data-param="glassMirror" type="number" step="any" />
          </div>
          <div class="control">
            <label for="glass-gloss-control">ガラスの照りの強さ</label>
            <input id="glass-gloss-control" data-param="glassGloss" type="number" step="any" />
          </div>
          <div class="control">
            <label for="glass-sharpness-control">ガラスの照りの鋭さ</label>
            <input id="glass-sharpness-control" data-param="glassSharpness" type="number" step="any" />
          </div>
          <div class="control">
            <label for="glass-eta-control">屈折率</label>
            <input id="glass-eta-control" data-param="glassEta" type="number" step="any" />
          </div>
          <!-- P120(issue #217): 分光の作り方(trt / shift)。丸い線のガラスでだけ効く。 -->
          <div class="control">
            <label for="glass-dispersion-mode-control">分光の作り方</label>
            <select id="glass-dispersion-mode-control" data-param="glassDispersionMode"></select>
          </div>
          <!-- P118(issue #213): 分光(2 次の照りの虹)。丸い線のガラスでだけ効く。 -->
          <div class="control">
            <label for="glass-dispersion-control">分光</label>
            <input id="glass-dispersion-control" data-param="glassDispersion" type="number" step="any" />
          </div>
          <div class="control">
            <label for="glass-second-gloss-control">2 次の照りの強さ</label>
            <input id="glass-second-gloss-control" data-param="glassSecondGloss" type="number" step="any" />
          </div>
          <div class="control">
            <label for="glass-second-width-control">2 次の照りの幅</label>
            <input id="glass-second-width-control" data-param="glassSecondWidth" type="number" step="any" />
          </div>
          <!-- P120(issue #217): shift の形のずれ(rad)。分光の作り方が shift のときだけ効く。 -->
          <div class="control">
            <label for="glass-second-shift-control">2 次の照りのずれ</label>
            <input id="glass-second-shift-control" data-param="glassSecondShift" type="number" step="any" />
          </div>
          <!-- P129(issue #235): ガラスの影の透け t(影の暗い側の κ′ = clamp(κ(1 − t), 0, 1))。丸い線・帯のガラスで効く。 -->
          <div class="control">
            <label for="glass-shadow-clear-control">ガラスの影の透け</label>
            <input id="glass-shadow-clear-control" data-param="glassShadowClear" type="number" step="any" />
          </div>
          <!-- P130(issue #236): ガラスの影の焦光(強さ g・区画の数 K・端の均し c)。丸い線のガラスでだけ効く。上限なし。 -->
          <div class="control">
            <label for="glass-caustic-gain-control">焦光の強さ</label>
            <input id="glass-caustic-gain-control" data-param="glassCausticGain" type="number" step="any" />
          </div>
          <div class="control">
            <label for="glass-caustic-samples-control">焦光の区画の数</label>
            <input id="glass-caustic-samples-control" data-param="glassCausticSamples" type="number" step="any" />
          </div>
          <div class="control">
            <label for="glass-caustic-bend-control">焦光の端の均し</label>
            <input id="glass-caustic-bend-control" data-param="glassCausticBend" type="number" step="any" />
          </div>
        </fieldset>

        <fieldset>
          <legend><button type="button" class="group-toggle" aria-expanded="true">撚り</button></legend>
          <!-- P57: 丸い線でだけ効く。帯のときはまとまりごと出さない。 -->
          <div class="control">
            <label for="ply-control">撚りの濃さ</label>
            <input id="ply-control" data-param="ply" type="range" min="0" max="1" step="0.05" />
            <output for="ply-control"></output>
          </div>
          <div class="control">
            <label for="ply-pitch-control">撚りの間隔</label>
            <input id="ply-pitch-control" data-param="plyPitch" type="range" min="1" max="12" step="0.5" />
            <output for="ply-pitch-control"></output>
          </div>
          <div class="control">
            <label for="ply-slope-control">撚りの傾き</label>
            <input id="ply-slope-control" data-param="plySlope" type="range" min="-1" max="1" step="0.05" />
            <output for="ply-slope-control"></output>
          </div>
          <div class="control">
            <label for="ply-contrast-control">撚りの明暗</label>
            <input id="ply-contrast-control" data-param="plyContrast" type="range" min="0" max="1" step="0.05" />
            <output for="ply-contrast-control"></output>
          </div>
          <!-- P110(issue #195): 撚りの表し方(明るさの縞・法線の揺らぎ)と、法線の揺らぎの溝の形・深さ・切れ込みの幅(上限を決めない)。 -->
          <div class="control">
            <label for="ply-mode-control">撚りの表し方</label>
            <select id="ply-mode-control" data-param="plyMode"></select>
          </div>
          <div class="control">
            <label for="ply-profile-control">溝の形</label>
            <select id="ply-profile-control" data-param="plyProfile"></select>
          </div>
          <div class="control">
            <label for="ply-gain-control">溝の深さ</label>
            <input id="ply-gain-control" data-param="plyGain" type="number" step="any" />
          </div>
          <div class="control">
            <label for="ply-notch-control">切れ込みの幅</label>
            <input id="ply-notch-control" data-param="plyNotch" type="number" step="any" />
          </div>
        </fieldset>

        <fieldset>
          <legend><button type="button" class="group-toggle" aria-expanded="true">形と伸び</button></legend>
          <div class="control">
            <label for="model-control">形</label>
            <select id="model-control" data-param="model"></select>
          </div>
          <div class="control">
            <label for="stretch-control">伸び</label>
            <input id="stretch-control" data-param="stretch" type="range" min="0" step="0.001" />
            <output for="stretch-control"></output>
          </div>
          <div class="stretch-actions">
            <button data-stretch-to="max" type="button">伸ばす</button>
            <button data-stretch-to="min" type="button">縮める</button>
          </div>
          <!--
            P67(issue #113): 伸びの測り方。絶対値 = 線ごとに 伸びる前の長さ + 伸び × 伸びの単位(どの線にも同じ長さを足す)、
            割合 = 伸びる前の長さ × (1 + 伸び)。伸びの単位(CSS px)は上限・下限なし。絶対値のときだけ効く。
          -->
          <div class="control">
            <label for="stretch-mode-control">伸びの測り方</label>
            <select id="stretch-mode-control" data-param="stretchMode"></select>
          </div>
          <div class="control">
            <label for="stretch-unit-control">伸びの単位</label>
            <input id="stretch-unit-control" data-param="stretchUnit" type="number" step="any" />
          </div>
          <!--
            P68(issue #115): 時間の決め方。同じ速さ = どの線も 1 秒に「伸びの速さ」px ずつ長さが変わる(線ごとに所要が違う)、
            一定の時間 = 伸ばす時間・1 本の時間(P68 の前の再生)。伸びの速さ(px/秒)は上限・下限なし。同じ速さのときだけ効く。
          -->
          <div class="control">
            <label for="stretch-timing-control">時間の決め方</label>
            <select id="stretch-timing-control" data-param="stretchTiming"></select>
          </div>
          <div class="control">
            <label for="stretch-speed-control">伸びの速さ</label>
            <input id="stretch-speed-control" data-param="stretchSpeed" type="number" step="any" />
          </div>
          <!--
            P93(issue #164): なめらかのつまみ(facilo の SmoothInOut の accel・decay・snap。単位は基準 60fps の 1 フレーム)。
            上限・下限なし。時間の決め方がなめらかのときだけ効く。
          -->
          <div class="control">
            <label for="stretch-smooth-accel-control">なめらかの加速</label>
            <input id="stretch-smooth-accel-control" data-param="stretchSmoothAccel" type="number" step="any" />
          </div>
          <div class="control">
            <label for="stretch-smooth-decay-control">なめらかの減衰</label>
            <input id="stretch-smooth-decay-control" data-param="stretchSmoothDecay" type="number" step="any" />
          </div>
          <div class="control">
            <label for="stretch-smooth-snap-control">なめらかの着地</label>
            <input id="stretch-smooth-snap-control" data-param="stretchSmoothSnap" type="number" step="any" />
          </div>
          <div class="control">
            <label for="stretch-duration-control">伸ばす時間</label>
            <input id="stretch-duration-control" data-param="stretchDuration" type="range" min="500" max="10000" step="100" />
            <output for="stretch-duration-control"></output>
          </div>
          <!--
            P58(issue #88): 伸ばす・縮めるの順。順番は線の添字の順(線の角度 45° では頁の左上から。
            角度が 45° でないと始まりは左上でない。135° では左下から)。P57 が並びを組み直すときは伸ばす・縮めると一緒に動かす。
          -->
          <div class="control">
            <label for="stretch-order-control">伸びの順</label>
            <select id="stretch-order-control" data-param="stretchOrder"></select>
          </div>
          <div class="control">
            <label for="stretch-line-duration-control">1 本の時間</label>
            <input id="stretch-line-duration-control" data-param="stretchLineDuration" type="number" step="any" />
          </div>
          <!-- P60(issue #93): 運針の流儀。機械 = 区画の中を入口の端から一方向、手 = 区画の中を中ほどから。順番のときだけ効く。 -->
          <div class="control">
            <label for="stitch-style-control">運針の流儀</label>
            <select id="stitch-style-control" data-param="stitchStyle"></select>
          </div>
          <!-- P64(issue #106): 引かれの強さ r。順番の再生で次の線は r 倍、その次は r² 倍ほど先に動く。上限・下限なし。順番のときだけ効く。 -->
          <div class="control">
            <label for="stretch-pull-control">引かれの強さ</label>
            <input id="stretch-pull-control" data-param="stretchPull" type="number" step="any" />
          </div>
          <!-- P92(issue #161): 引かれの遅れ δ(ms)。前の線の進みが δ 遅れて次の線に効く。上限・下限なし。順番で引かれ > 0 のときだけ効く。 -->
          <div class="control">
            <label for="stretch-pull-delay-control">引かれの遅れ</label>
            <input id="stretch-pull-delay-control" data-param="stretchPullDelay" type="number" step="any" />
          </div>
          <div class="control">
            <label for="twist-control">輪の傾き</label>
            <input id="twist-control" data-param="twist" type="range" min="0" max="90" step="1" />
            <output for="twist-control"></output>
          </div>
          <div class="control">
            <label for="align-control">向きの揃い</label>
            <input id="align-control" data-param="align" type="range" min="0" max="1" step="0.01" />
            <output for="align-control"></output>
          </div>
          <div class="control">
            <label for="p-control">輪の丸み</label>
            <input id="p-control" data-param="p" type="range" min="0" max="2" step="0.05" />
            <output for="p-control"></output>
          </div>
          <div class="control">
            <label for="phi-max-control">倒れの上限</label>
            <input id="phi-max-control" data-param="phiMax" type="range" min="0" max="90" step="1" />
            <output for="phi-max-control"></output>
          </div>
          <div class="control">
            <label for="phi-ref-control">倒れきる伸び</label>
            <input id="phi-ref-control" data-param="phiRef" type="range" min="0.1" max="2" step="0.05" />
            <output for="phi-ref-control"></output>
          </div>
        </fieldset>

        <fieldset>
          <legend><button type="button" class="group-toggle" aria-expanded="true">重力</button></legend>
          <div class="control">
            <label for="gravity-beta-control">重力の向き</label>
            <input id="gravity-beta-control" data-param="gravityBeta" type="range" min="0" max="90" step="1" />
            <output for="gravity-beta-control"></output>
          </div>
          <div class="control">
            <label for="gravity-alpha-control">重力の方位</label>
            <input id="gravity-alpha-control" data-param="gravityAlpha" type="range" min="0" max="360" step="1" />
            <output for="gravity-alpha-control"></output>
          </div>
          <div class="control">
            <label for="wire-smax-control">たわみの上限</label>
            <input id="wire-smax-control" data-param="wireSmax" type="range" min="0" max="1" step="0.05" />
            <output for="wire-smax-control"></output>
          </div>
          <div class="control">
            <label for="wire-lref-control">たわみの基準の長さ</label>
            <input id="wire-lref-control" data-param="wireLref" type="range" min="10" max="300" step="5" />
            <output for="wire-lref-control"></output>
          </div>
        </fieldset>

        <fieldset>
          <legend><button type="button" class="group-toggle" aria-expanded="true">光と影</button></legend>
          <!-- P57: 陰影・艶の鋭さはどちらの断面でも効く面の明暗なので、光と影へ寄せた。 -->
          <div class="control">
            <label for="light-azimuth-control">光の向き</label>
            <input id="light-azimuth-control" data-param="lightAzimuth" type="range" min="0" max="360" step="1" />
            <output for="light-azimuth-control"></output>
          </div>
          <div class="control">
            <label for="elevation-control">光の高さ</label>
            <input id="elevation-control" data-param="elevation" type="range" min="10" max="80" step="1" />
            <output for="elevation-control"></output>
          </div>
          <div class="control">
            <label for="shadow-strength-control">影の強さ</label>
            <input id="shadow-strength-control" data-param="shadowStrength" type="number" min="0" step="any" />
          </div>
          <div class="control">
            <label for="light-size-control">光源の大きさ</label>
            <input id="light-size-control" data-param="lightSize" type="number" min="0" step="any" />
          </div>
          <div class="control">
            <label for="shadow-ratio-control">糸の浮き</label>
            <input id="shadow-ratio-control" data-param="shadowRatio" type="range" min="0" max="1" step="0.05" />
            <output for="shadow-ratio-control"></output>
          </div>
          <div class="control">
            <label for="k-control">短い糸の浮き</label>
            <input id="k-control" data-param="k" type="range" min="0" max="0.5" step="0.01" />
            <output for="k-control"></output>
          </div>
          <div class="control">
            <label for="shade-control">陰影</label>
            <input id="shade-control" data-param="shade" type="range" min="0" max="1" step="0.05" />
            <output for="shade-control"></output>
          </div>
          <div class="control">
            <label for="shininess-control">艶の鋭さ</label>
            <input id="shininess-control" data-param="shininess" type="range" min="1" max="64" step="1" />
            <output for="shininess-control"></output>
          </div>
        </fieldset>

        <fieldset>
          <legend><button type="button" class="group-toggle" aria-expanded="true">細部</button></legend>
          <div class="control">
            <label for="step-control">線の細かさ</label>
            <input id="step-control" data-param="step" type="range" min="0.05" max="0.5" step="0.05" />
            <output for="step-control"></output>
          </div>
          <div class="control">
            <label for="merge-gap-control">線をつなぐ間隔</label>
            <input id="merge-gap-control" data-param="mergeGap" type="range" min="0" max="10" step="0.5" />
            <output for="merge-gap-control"></output>
          </div>
          <div class="control">
            <label for="min-len-control">最短の線</label>
            <input id="min-len-control" data-param="minLen" type="range" min="0" max="20" step="0.5" />
            <output for="min-len-control"></output>
          </div>
          <div class="control">
            <label for="align-scale-control">揃いの広がり</label>
            <input id="align-scale-control" data-param="alignScale" type="range" min="10" max="300" step="5" />
            <output for="align-scale-control"></output>
          </div>
        </fieldset>

        <fieldset>
          <legend><button type="button" class="group-toggle" aria-expanded="true">視点</button></legend>
          <div class="control">
            <label for="camera-drag-tilt-control">ドラッグの傾きの比</label>
            <input id="camera-drag-tilt-control" data-param="cameraDragTilt" type="number" step="any" />
          </div>
          <div class="control">
            <label for="camera-drag-turn-control">ドラッグの回転の比</label>
            <input id="camera-drag-turn-control" data-param="cameraDragTurn" type="number" step="any" />
          </div>
          <div class="control">
            <label for="camera-wheel-zoom-control">ホイールの比</label>
            <input id="camera-wheel-zoom-control" data-param="cameraWheelZoom" type="number" step="any" />
          </div>
          <div class="control">
            <label for="camera-fov-control">視野角</label>
            <input id="camera-fov-control" data-param="cameraFov" type="range" min="0" step="1" />
            <output for="camera-fov-control"></output>
          </div>
          <div class="control">
            <label for="thread-widen-control">太さの上乗せ</label>
            <input id="thread-widen-control" data-param="threadWiden" type="number" step="any" />
          </div>
          <div class="control">
            <label for="thread-min-radius-control">太さの下限</label>
            <input id="thread-min-radius-control" data-param="threadMinRadius" type="number" step="any" />
          </div>
        </fieldset>

        <div class="panel-foot">
          <button data-reset type="button">初期値に戻す</button>
          <small class="build-version" data-build-version>dev</small>
        </div>
      </form>
    </details>
    <canvas role="img" aria-label="糸で刺繍した図"></canvas>
  </body>
</html>
