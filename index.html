<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Text Weaving</title>
    <link rel="icon" href="data:," />
    <style>html{color:#17221f;background:#6fcee2;font-family:system-ui,sans-serif}body{box-sizing:border-box;place-items:center;height:100dvh;margin:0;display:grid;overflow:hidden}details{z-index:1;box-sizing:border-box;background:#ffffff8c;border-radius:.75rem;width:max-content;max-width:calc(100vw - 1rem);max-height:calc(100dvh - 1rem);position:fixed;inset-block-start:.5rem;inset-inline-start:50%;overflow-y:auto;translate:-50%}summary{box-sizing:border-box;cursor:pointer;width:max-content;padding:.35rem .75rem;font-weight:600}form{box-sizing:border-box;background:#ffffff8c;border-radius:.75rem;flex-wrap:wrap;justify-content:center;align-items:center;gap:.5rem;width:max-content;max-width:calc(100vw - 1rem);padding:.5rem;display:flex}fieldset{border:1px solid #17221f40;border-radius:.5rem;flex-wrap:wrap;align-items:center;gap:.5rem;margin:0;padding:.35rem .5rem .5rem;display:flex}.control{grid-template-columns:auto minmax(0,8rem) auto;align-items:center;gap:.35rem;display:grid}input,select,button,output{font:inherit}input[type=text]{width:9rem;min-width:0}input[type=color],button{justify-self:start}.stretch-actions{gap:.25rem;display:flex}.stretch-actions button{padding:.15rem .4rem}canvas{max-width:none;display:block}</style>
    <script type="module" crossorigin src="./assets/index-lNnMA2mQ.js"></script>
  </head>
  <body>
    <details>
      <summary>調整</summary>
      <form aria-label="見た目の調整">
        <div class="control">
          <label for="text-control">文字</label>
          <input id="text-control" data-param="text" type="text" />
        </div>

        <fieldset>
          <legend>糸</legend>
          <div class="control">
            <label for="pitch-control">糸の間隔</label>
            <input id="pitch-control" data-param="pitch" type="range" min="4" max="30" step="0.5" />
            <output for="pitch-control"></output>
          </div>
          <div class="control">
            <label for="width-control">糸の太さ</label>
            <input id="width-control" data-param="width" type="range" min="0.5" max="12" step="0.1" />
            <output for="width-control"></output>
          </div>
          <div class="control">
            <label for="thread-color-control">糸の色</label>
            <input id="thread-color-control" data-param="threadColor" type="color" />
          </div>
          <div class="control">
            <label for="model-control">形</label>
            <select id="model-control" data-param="model"></select>
          </div>
          <div class="control">
            <label for="stretch-control">伸び</label>
            <input id="stretch-control" data-param="stretch" type="range" min="0" step="0.001" />
            <output for="stretch-control"></output>
          </div>
          <div class="stretch-actions">
            <button data-stretch-to="max" type="button">伸ばす</button>
            <button data-stretch-to="min" type="button">縮める</button>
          </div>
        </fieldset>

        <fieldset>
          <legend>色</legend>
          <div class="control">
            <label for="background-control">背景色</label>
            <input id="background-control" data-param="background" type="color" />
          </div>
        </fieldset>

        <fieldset>
          <legend>影</legend>
          <div class="control">
            <label for="shadow-alpha-control">影の濃さ</label>
            <input id="shadow-alpha-control" data-param="shadowAlpha" type="range" min="0" max="1" step="0.05" />
            <output for="shadow-alpha-control"></output>
          </div>
          <div class="control">
            <label for="shadow-ratio-control">浮き</label>
            <input id="shadow-ratio-control" data-param="shadowRatio" type="range" min="0" max="1" step="0.05" />
            <output for="shadow-ratio-control"></output>
          </div>
        </fieldset>

        <button data-reset type="button">初期値に戻す</button>
      </form>
    </details>
    <canvas role="img" aria-label="糸で刺繍した図"></canvas>
  </body>
</html>
