<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Text Weaving</title>
    <link rel="icon" href="data:," />
    <style>html{color:#17221f;background:#6fcee2;font-family:system-ui,sans-serif}body{box-sizing:border-box;place-items:center;height:100dvh;margin:0;display:grid;overflow:hidden}details{z-index:1;box-sizing:border-box;background:#ffffff8c;border-radius:.75rem;width:max-content;max-width:calc(100vw - 1rem);max-height:33dvh;position:fixed;inset-block-start:.5rem;inset-inline-start:50%;overflow-y:auto;translate:-50%}summary{box-sizing:border-box;cursor:pointer;width:max-content;padding:.35rem .75rem;font-weight:600}form{box-sizing:border-box;background:#ffffff8c;border-radius:.75rem;flex-wrap:wrap;justify-content:center;align-items:center;gap:.5rem;width:max-content;max-width:calc(100vw - 1rem);padding:.5rem;display:flex}fieldset{box-sizing:border-box;border:1px solid #17221f40;border-radius:.5rem;flex-wrap:wrap;align-items:center;gap:.5rem;max-width:min(100%,36rem);margin:0;padding:.35rem .5rem .5rem;display:flex}.control{grid-template-columns:auto minmax(0,8rem) auto;align-items:center;gap:.35rem;display:grid}.control:has(>input[type=text]){grid-template-columns:auto minmax(0,9.5rem) auto}legend{padding:0 .15rem}.group-toggle{color:inherit;cursor:pointer;background:0 0;border:0;border-radius:.35rem;padding:.1rem .35rem;font-weight:600}.group-toggle:hover{background:#ffffff80}.group-toggle:after{content:"";vertical-align:middle;border-block-start:.38rem solid;border-inline:.28rem solid #0000;margin-inline-start:.35rem;transition:rotate .15s;display:inline-block}.group-toggle[aria-expanded=false]:after{rotate:-90deg}fieldset[data-collapsed]{padding-block:0 .2rem}fieldset[data-collapsed]>:not(legend),.control[hidden],fieldset[hidden]{display:none!important}.control.is-off>label,.control.is-off>output{opacity:.5}.note{contain:inline-size;text-overflow:ellipsis;white-space:nowrap;grid-column:1/-1;block-size:1.3em;font-size:.75rem;line-height:1.3;display:block;overflow:hidden}.note[hidden]{visibility:hidden;display:block!important}.panel-foot{align-items:center;gap:.5rem;display:flex}.build-version{opacity:.75;white-space:nowrap;font-size:.7rem}@media (width>=640px) and (height>=500px){details{max-height:min(33dvh,200px)}}input,select,button,output{font:inherit}output[for]{width:calc(var(--output-characters) * 1ch + .25em);min-width:calc(var(--output-characters) * 1ch + .25em);box-sizing:border-box;font-variant-numeric:tabular-nums;white-space:nowrap;display:inline-block}input[type=text]{width:9rem;min-width:0}input[type=color]{justify-self:start}input[type=number]{box-sizing:border-box;width:100%;min-width:0}button{justify-self:start}.stretch-actions{gap:.25rem;display:flex}.stretch-actions button{padding:.15rem .4rem}canvas{touch-action:none;max-width:none;display:block}</style>
    <script type="module" crossorigin src="./assets/index-BJxmtj-E.js"></script>
  </head>
  <body>
    <details>
      <summary>調整</summary>
      <form aria-label="見た目の調整">
        <fieldset>
          <legend><button type="button" class="group-toggle" aria-expanded="true">文字</button></legend>
          <div class="control">
            <label for="text-control">文字</label>
            <input id="text-control" data-param="text" type="text" />
          </div>
          <div class="control">
            <label for="font-control">書体</label>
            <input id="font-control" data-param="font" type="text" />
          </div>
          <div class="control">
            <label for="background-control">背景色</label>
            <input id="background-control" data-param="background" type="color" />
          </div>
        </fieldset>

        <fieldset>
          <legend><button type="button" class="group-toggle" aria-expanded="true">線と帯</button></legend>
          <!--
            P57(issue #86): 断面を先頭に置き(パネルの上の方)、続けて断面で決まる見た目(丸い線: 糸の色、帯: 帯の幅・表の色)、
            そのあと断面に依らない線の並び。効かない断面の項目は hidden(src/ui/controls.ts の SECTION_ONLY)。
          -->
          <div class="control">
            <label for="section-control">断面</label>
            <select id="section-control" data-param="section"></select>
          </div>
          <div class="control">
            <label for="thread-color-control">糸の色</label>
            <input id="thread-color-control" data-param="threadColor" type="color" />
          </div>
          <div class="control">
            <label for="band-width-control">帯の幅</label>
            <input id="band-width-control" data-param="bandWidth" type="range" min="1" max="30" step="0.5" />
            <output for="band-width-control"></output>
          </div>
          <div class="control">
            <label for="band-front-control">表の色</label>
            <input id="band-front-control" data-param="bandFront" type="color" />
          </div>
          <div class="control">
            <label for="pitch-control">糸の間隔</label>
            <input id="pitch-control" data-param="pitch" type="range" min="4" max="30" step="0.5" />
            <output for="pitch-control"></output>
          </div>
          <div class="control">
            <label for="width-control">糸の太さ</label>
            <input id="width-control" data-param="width" type="range" min="0.5" max="12" step="0.1" />
            <output for="width-control"></output>
          </div>
          <div class="control">
            <label for="angle-control">線の角度</label>
            <input id="angle-control" data-param="angle" type="range" min="0" max="180" step="1" />
            <output for="angle-control"></output>
          </div>
        </fieldset>

        <fieldset>
          <legend><button type="button" class="group-toggle" aria-expanded="true">撚り</button></legend>
          <!-- P57: 丸い線でだけ効く。帯のときはまとまりごと出さない。 -->
          <div class="control">
            <label for="ply-control">撚りの濃さ</label>
            <input id="ply-control" data-param="ply" type="range" min="0" max="1" step="0.05" />
            <output for="ply-control"></output>
          </div>
          <div class="control">
            <label for="ply-pitch-control">撚りの間隔</label>
            <input id="ply-pitch-control" data-param="plyPitch" type="range" min="1" max="12" step="0.5" />
            <output for="ply-pitch-control"></output>
          </div>
          <div class="control">
            <label for="ply-slope-control">撚りの傾き</label>
            <input id="ply-slope-control" data-param="plySlope" type="range" min="-1" max="1" step="0.05" />
            <output for="ply-slope-control"></output>
          </div>
          <div class="control">
            <label for="ply-contrast-control">撚りの明暗</label>
            <input id="ply-contrast-control" data-param="plyContrast" type="range" min="0" max="1" step="0.05" />
            <output for="ply-contrast-control"></output>
          </div>
        </fieldset>

        <fieldset>
          <legend><button type="button" class="group-toggle" aria-expanded="true">形と伸び</button></legend>
          <div class="control">
            <label for="model-control">形</label>
            <select id="model-control" data-param="model"></select>
          </div>
          <div class="control">
            <label for="stretch-control">伸び</label>
            <input id="stretch-control" data-param="stretch" type="range" min="0" step="0.001" />
            <output for="stretch-control"></output>
          </div>
          <div class="stretch-actions">
            <button data-stretch-to="max" type="button">伸ばす</button>
            <button data-stretch-to="min" type="button">縮める</button>
          </div>
          <div class="control">
            <label for="stretch-duration-control">伸ばす時間</label>
            <input id="stretch-duration-control" data-param="stretchDuration" type="range" min="500" max="10000" step="100" />
            <output for="stretch-duration-control"></output>
          </div>
          <!--
            P58(issue #88): 伸ばす・縮めるの順。順番は線の添字の順(線の角度 45° では頁の左上から。
            角度が 45° でないと始まりは左上でない。135° では左下から)。P57 が並びを組み直すときは伸ばす・縮めると一緒に動かす。
          -->
          <div class="control">
            <label for="stretch-order-control">伸びの順</label>
            <select id="stretch-order-control" data-param="stretchOrder"></select>
          </div>
          <div class="control">
            <label for="stretch-line-duration-control">1 本の時間</label>
            <input id="stretch-line-duration-control" data-param="stretchLineDuration" type="number" step="any" />
          </div>
          <!-- P60(issue #93): 運針の流儀。機械 = 区画の中を入口の端から一方向、手 = 区画の中を中ほどから。順番のときだけ効く。 -->
          <div class="control">
            <label for="stitch-style-control">運針の流儀</label>
            <select id="stitch-style-control" data-param="stitchStyle"></select>
          </div>
          <!-- P64(issue #106): 引かれの強さ r。順番の再生で次の線は r 倍、その次は r² 倍ほど先に動く。上限・下限なし。順番のときだけ効く。 -->
          <div class="control">
            <label for="stretch-pull-control">引かれの強さ</label>
            <input id="stretch-pull-control" data-param="stretchPull" type="number" step="any" />
          </div>
          <div class="control">
            <label for="twist-control">輪の傾き</label>
            <input id="twist-control" data-param="twist" type="range" min="0" max="90" step="1" />
            <output for="twist-control"></output>
          </div>
          <div class="control">
            <label for="align-control">向きの揃い</label>
            <input id="align-control" data-param="align" type="range" min="0" max="1" step="0.01" />
            <output for="align-control"></output>
          </div>
          <div class="control">
            <label for="p-control">輪の丸み</label>
            <input id="p-control" data-param="p" type="range" min="0" max="2" step="0.05" />
            <output for="p-control"></output>
          </div>
          <div class="control">
            <label for="phi-max-control">倒れの上限</label>
            <input id="phi-max-control" data-param="phiMax" type="range" min="0" max="90" step="1" />
            <output for="phi-max-control"></output>
          </div>
          <div class="control">
            <label for="phi-ref-control">倒れきる伸び</label>
            <input id="phi-ref-control" data-param="phiRef" type="range" min="0.1" max="2" step="0.05" />
            <output for="phi-ref-control"></output>
          </div>
        </fieldset>

        <fieldset>
          <legend><button type="button" class="group-toggle" aria-expanded="true">重力</button></legend>
          <div class="control">
            <label for="gravity-beta-control">重力の向き</label>
            <input id="gravity-beta-control" data-param="gravityBeta" type="range" min="0" max="90" step="1" />
            <output for="gravity-beta-control"></output>
          </div>
          <div class="control">
            <label for="gravity-alpha-control">重力の方位</label>
            <input id="gravity-alpha-control" data-param="gravityAlpha" type="range" min="0" max="360" step="1" />
            <output for="gravity-alpha-control"></output>
          </div>
          <div class="control">
            <label for="wire-smax-control">たわみの上限</label>
            <input id="wire-smax-control" data-param="wireSmax" type="range" min="0" max="1" step="0.05" />
            <output for="wire-smax-control"></output>
          </div>
          <div class="control">
            <label for="wire-lref-control">たわみの基準の長さ</label>
            <input id="wire-lref-control" data-param="wireLref" type="range" min="10" max="300" step="5" />
            <output for="wire-lref-control"></output>
          </div>
        </fieldset>

        <fieldset>
          <legend><button type="button" class="group-toggle" aria-expanded="true">光と影</button></legend>
          <!-- P57: 陰影・艶の鋭さはどちらの断面でも効く面の明暗なので、光と影へ寄せた。 -->
          <div class="control">
            <label for="light-azimuth-control">光の向き</label>
            <input id="light-azimuth-control" data-param="lightAzimuth" type="range" min="0" max="360" step="1" />
            <output for="light-azimuth-control"></output>
          </div>
          <div class="control">
            <label for="elevation-control">光の高さ</label>
            <input id="elevation-control" data-param="elevation" type="range" min="10" max="80" step="1" />
            <output for="elevation-control"></output>
          </div>
          <div class="control">
            <label for="shadow-alpha-control">影の濃さ</label>
            <input id="shadow-alpha-control" data-param="shadowAlpha" type="range" min="0" max="1" step="0.05" />
            <output for="shadow-alpha-control"></output>
          </div>
          <div class="control">
            <label for="shadow-ratio-control">糸の浮き</label>
            <input id="shadow-ratio-control" data-param="shadowRatio" type="range" min="0" max="1" step="0.05" />
            <output for="shadow-ratio-control"></output>
          </div>
          <div class="control">
            <label for="k-control">短い糸の浮き</label>
            <input id="k-control" data-param="k" type="range" min="0" max="0.5" step="0.01" />
            <output for="k-control"></output>
          </div>
          <div class="control">
            <label for="shade-control">陰影</label>
            <input id="shade-control" data-param="shade" type="range" min="0" max="1" step="0.05" />
            <output for="shade-control"></output>
          </div>
          <div class="control">
            <label for="shininess-control">艶の鋭さ</label>
            <input id="shininess-control" data-param="shininess" type="range" min="1" max="64" step="1" />
            <output for="shininess-control"></output>
          </div>
        </fieldset>

        <fieldset>
          <legend><button type="button" class="group-toggle" aria-expanded="true">細部</button></legend>
          <div class="control">
            <label for="step-control">線の細かさ</label>
            <input id="step-control" data-param="step" type="range" min="0.05" max="0.5" step="0.05" />
            <output for="step-control"></output>
          </div>
          <div class="control">
            <label for="merge-gap-control">線をつなぐ間隔</label>
            <input id="merge-gap-control" data-param="mergeGap" type="range" min="0" max="10" step="0.5" />
            <output for="merge-gap-control"></output>
          </div>
          <div class="control">
            <label for="min-len-control">最短の線</label>
            <input id="min-len-control" data-param="minLen" type="range" min="0" max="20" step="0.5" />
            <output for="min-len-control"></output>
          </div>
          <div class="control">
            <label for="align-scale-control">揃いの広がり</label>
            <input id="align-scale-control" data-param="alignScale" type="range" min="10" max="300" step="5" />
            <output for="align-scale-control"></output>
          </div>
        </fieldset>

        <fieldset>
          <legend><button type="button" class="group-toggle" aria-expanded="true">視点</button></legend>
          <div class="control">
            <label for="camera-drag-tilt-control">ドラッグの傾きの比</label>
            <input id="camera-drag-tilt-control" data-param="cameraDragTilt" type="number" step="any" />
          </div>
          <div class="control">
            <label for="camera-drag-turn-control">ドラッグの回転の比</label>
            <input id="camera-drag-turn-control" data-param="cameraDragTurn" type="number" step="any" />
          </div>
          <div class="control">
            <label for="camera-wheel-zoom-control">ホイールの比</label>
            <input id="camera-wheel-zoom-control" data-param="cameraWheelZoom" type="number" step="any" />
          </div>
        </fieldset>

        <div class="panel-foot">
          <button data-reset type="button">初期値に戻す</button>
          <small class="build-version" data-build-version>dev</small>
        </div>
      </form>
    </details>
    <canvas role="img" aria-label="糸で刺繍した図"></canvas>
  </body>
</html>
